<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>История тестов</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
<main>
  <div class="toolbar">
    <nav aria-label="Результаты прогонов" id="filters"></nav>
    <div class="tools">
      <button id="refresh" title="Обновить" aria-label="Обновить">↻</button>
      <button id="cleanup" disabled>Очистить</button>
      <button id="settings" aria-label="Настройки хранения" title="Настройки хранения" disabled>⚙</button>
    </div>
  </div>
  <div class="search-row">
    <input id="search" type="search" placeholder="Найти отчёт" aria-label="Поиск прогонов">
    <div class="storage">
      <div id="storage-label"></div>
      <div id="storage-progress" role="progressbar" aria-label="Занятое место в истории отчётов" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0">
        <span id="storage-saved"></span><span id="storage-temporary"></span>
      </div>
      <div class="storage-legend">
        <span><i class="saved-dot" aria-hidden="true"></i>Отчёты <span id="saved-size"></span></span>
        <span><i class="temporary-dot" aria-hidden="true"></i>Временные <span id="temporary-size"></span></span>
      </div>
    </div>
  </div>
  <div id="notice" role="status" aria-live="polite"></div>
  <div id="runs" aria-label="Прогоны"></div>
</main>

<dialog id="settings-dialog" aria-labelledby="settings-title">
  <form id="settings-form">
    <header><h2 id="settings-title">Хранение отчётов</h2><button type="button" class="close" aria-label="Закрыть настройки">×</button></header>
    <div class="form-body">
      <label class="check"><input type="checkbox" name="autoCleanup"> Автоматическая очистка после прогона</label>
      <div class="fields">
        <label>Количество прогонов<input name="maxRuns" type="number" min="0" step="1" required></label>
        <label>Лимит места, ГиБ<input name="maxGiB" type="number" min="0" step="0.01" required></label>
        <label>Успешные прогоны, дней<input name="passedDays" type="number" min="0" step="1" required></label>
        <label>Ошибки и прерывания, дней<input name="failedDays" type="number" min="0" step="1" required></label>
        <label>Сохранять последних полных баз<input name="keepBase" type="number" min="0" step="1" required></label>
      </div>
      <p class="hint">0 — без ограничения; для полных баз — без дополнительной защиты.</p>
      <label class="check"><input type="checkbox" name="protectLatest"> Сохранять последний прогон при автоочистке</label>
      <p class="hint">Закреплённые прогоны не удаляются автоматически. Сохранение настроек не запускает очистку.</p>
      <p class="form-error" role="alert"></p>
    </div>
    <footer><button type="button" class="cancel">Отмена</button><button type="submit" class="primary">Сохранить</button></footer>
  </form>
</dialog>

<dialog id="confirm-dialog" aria-labelledby="confirm-title">
  <header><h2 id="confirm-title"></h2><button class="close" aria-label="Закрыть подтверждение">×</button></header>
  <div class="form-body"><p id="confirm-text"></p><ul id="confirm-list"></ul><p class="form-error" role="alert"></p></div>
  <footer><button class="cancel">Отмена</button><button id="confirm-action" class="danger">Удалить</button></footer>
</dialog>
</body>
</html>
